<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The CISO Ladder: Decision Map</title>
<meta name="description" content="The full decision tree of The CISO Ladder with live class results. CIS 424, Purple Protocol, Sprint 2.">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080b;--panel:#0f1117;--line:#2a2e38;--text:#f2f3f5;--muted:#b7bdc8;--gold:#e8b33a;--red:#e2554b;--teal:#7fd1c7}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.75) 100%)}
#viewport{position:fixed;inset:0;cursor:grab}#viewport.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
svg#links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.card{position:absolute;width:420px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.6);transition:border-color .3s,box-shadow .3s}
.card.focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(232,179,58,.35),0 30px 70px rgba(0,0,0,.7)}
.card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.card .hd{padding:12px 14px 4px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .sc{font-family:"Bebas Neue";font-size:24px;letter-spacing:.05em}
.card .id{color:var(--muted);font-size:12px;white-space:nowrap}
.card .skill{margin:0 14px;display:inline-block;color:#111;background:var(--gold);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:2px}
.card .real{padding:8px 14px 4px;color:#d9dce2;font-size:13.5px;line-height:1.45}
.card .timed{color:var(--red);font-size:11px;letter-spacing:.15em;text-transform:uppercase;margin-left:6px}
.opts{padding:6px 10px 12px}
.opt{padding:7px 8px;border-radius:4px;margin-top:5px;background:#151821;position:relative}
.opt .t{font-weight:700;font-size:13.5px;display:flex;justify-content:space-between;gap:6px}
.opt .pc{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}.opt .pc b{color:var(--teal);font-weight:500}.opt .pc i{color:#f0a59e;font-style:normal}
.opt .bar{height:4px;background:#22252d;border-radius:2px;margin-top:5px;overflow:hidden}.opt .bar span{display:block;height:100%;width:0;background:var(--gold);transition:width .8s ease}
.opt .n{color:var(--gold);font-size:12px;font-weight:700}
.opt .flag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#111;background:var(--teal);padding:1px 5px;border-radius:2px;margin-left:4px}
.opt .flag.bad{background:var(--red)}
.opt.hit{animation:hit 1.2s ease-out}
@keyframes hit{0%{background:#5a4718;box-shadow:0 0 0 2px #e8b33a}100%{background:#151821;box-shadow:0 0 0 0 transparent}}
.opt .n{white-space:nowrap}
.variant{position:absolute;width:380px;background:#14111f;border:1px solid #5b4b8f;border-radius:6px;padding:10px 12px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.variant.cb{border-style:dashed}
.variant .vk{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#b39cff;margin-bottom:5px}
.variant .vl{font-size:13px;line-height:1.4;color:#e6e2f3;margin-top:3px}.variant .vl b{color:#d9c8ff;font-weight:700;margin-right:4px}
#sparkfx{position:fixed;inset:0;pointer-events:none;z-index:4}
#awards{position:fixed;inset:0;z-index:8;display:none;align-items:center;justify-content:center;background:#07080b;overflow:hidden}
#awards.on{display:flex}
#awards::before{content:"";position:absolute;inset:-40px;background:var(--still) center/cover;filter:blur(14px) saturate(.7);opacity:.22}
#awards .aw{position:relative;text-align:center;max-width:1100px;padding:0 24px}
#awards .ak{font-size:15px;letter-spacing:.3em;text-transform:uppercase;color:#b7bdc8}
#awards .at{font-family:"Bebas Neue";font-size:clamp(56px,9vw,128px);color:var(--gold);letter-spacing:.04em;line-height:1;margin-top:18px}
#awards .aname{font-family:"Bebas Neue";font-size:clamp(64px,12vw,170px);color:#fff;line-height:1;margin-top:10px;text-shadow:0 0 40px rgba(232,179,58,.35)}
#awards .av{font-size:24px;color:#7fd1c7;font-weight:700;margin-top:10px}
#awards .as{font-size:22px;color:#d9dce2;margin-top:10px}
#awards .ae{font-size:19px;color:#d9dce2;margin-top:26px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:6px;padding:12px 18px;display:inline-block}
#awards .ae span{color:var(--gold);font-weight:700;letter-spacing:.15em;text-transform:uppercase;font-size:13px;margin-right:8px}#awards .ae i{color:#b7bdc8;margin-left:8px;font-size:15px}
#awards .ar{font-size:17px;color:#b7bdc8;margin-top:22px}
#awards .adots{margin-top:30px;display:flex;gap:8px;justify-content:center}#awards .adots i{width:8px;height:8px;border-radius:50%;background:#3a3f4a}#awards .adots i.on{background:var(--gold)}
.lanehead{position:absolute;width:360px;background:#0c1716;border:1px solid #2f6f68;border-left:5px solid #7fd1c7;border-radius:6px;padding:14px 16px;box-shadow:0 14px 34px rgba(0,0,0,.5)}
.lanehead.base{border-left-color:#8a909c;border-color:#3a3f4a;background:#111318}
.lanehead .lk{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#7fd1c7}.lanehead.base .lk{color:#b7bdc8}
.lanehead .lt{font-family:"Bebas Neue";font-size:40px;letter-spacing:.04em;margin:2px 0 6px;color:#fff}
.lanehead .lg{font-size:15px;line-height:1.45;color:#d9dce2}
.diamond{position:absolute;width:96px;height:96px;transform:rotate(45deg);border:2px solid #7fd1c7;background:#0c1716;display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(127,209,199,.25)}
.diamond span{transform:rotate(-45deg);font:700 13px Inter;letter-spacing:.18em;color:#7fd1c7}
.card.route{border-color:#2f6f68}
.ephead{position:absolute;font-family:"Bebas Neue";color:var(--gold);letter-spacing:.06em;white-space:nowrap}
.ephead small{display:block;font-family:Inter;color:var(--muted);font-size:20px;letter-spacing:0}
.ending{position:absolute;width:380px;background:#121008;border:1px solid #5a4a1c;border-radius:8px;overflow:hidden}
.ending img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;opacity:.9}
.ending .sc{font-family:"Bebas Neue";font-size:30px;padding:10px 14px 0;color:var(--gold)}
.ending p{padding:4px 14px 12px;font-size:13px;color:#ddd;line-height:1.45}.ending .n{color:var(--gold);font-weight:700;font-size:13px;padding:0 14px 12px}
/* fixed overlay panels for tour stops */
#panel{position:fixed;left:3vw;bottom:5vh;width:min(560px,92vw);background:rgba(8,9,12,.9);border:1px solid var(--line);border-radius:8px;padding:20px 22px;backdrop-filter:blur(6px);transition:opacity .4s;z-index:5}
#panel.hide{opacity:0;pointer-events:none}
#panel .k{color:var(--gold);letter-spacing:.35em;font-size:12px;text-transform:uppercase}
#panel h2{font-family:"Bebas Neue";font-weight:400;font-size:44px;line-height:1;margin:6px 0 8px}
#panel p,#panel li{color:#dfe2e8;line-height:1.5;font-size:15px}#panel ul,#panel ol{padding-left:20px}#panel li{margin-top:4px}
#panel .speaker{float:right;color:#111;background:var(--teal);font-weight:700;font-size:12px;padding:3px 8px;border-radius:2px}
#panel .src{color:var(--muted);font-size:12px;margin-top:8px}
#hero{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:6vw;z-index:6;background:radial-gradient(ellipse at 30% 40%,#1a1508,#07080b 70%);transition:opacity .6s}
#hero.hide{opacity:0;pointer-events:none}
#hero h1{font-family:"Bebas Neue";font-weight:400;font-size:clamp(64px,9vw,150px);line-height:.9;letter-spacing:.04em}#hero h1 span{color:var(--gold)}
#hero .sub{color:var(--muted);margin-top:14px;font-size:18px;max-width:520px}
#qrbox{background:#fff;padding:18px;border-radius:10px;text-align:center}
#qrbox .cap{color:#111;font:700 18px Inter;margin-top:10px;letter-spacing:.05em}#qrbox .url{color:#333;font-size:13px;margin-top:4px}
#live{position:fixed;top:16px;right:18px;z-index:7;background:rgba(8,9,12,.85);border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:13px;display:flex;gap:8px;align-items:center}
#live i{width:9px;height:9px;border-radius:50%;background:#555}#live.on i{background:#3fd27a;box-shadow:0 0 8px #3fd27a}
#hud{position:fixed;bottom:14px;right:18px;z-index:7;color:var(--muted);font-size:12px}
#miniqr{position:fixed;top:56px;right:18px;z-index:7;background:#fff;padding:6px;border-radius:6px;display:none}#miniqr.on{display:block}
@media (max-width:760px){#hero{flex-direction:column;gap:24px;padding:20px;text-align:center}#panel{left:4vw;bottom:2vh;padding:14px}#panel h2{font-size:32px}}
</style>
</head>
<body>
<div id="viewport"><div id="world"><svg id="links"></svg></div></div>
<div id="hero">
  <div>
    <h1>THE <span>CISO</span><br>LADDER</h1>
    <div class="sub">Scan the code and play. Every choice you make shows up on this map, live, as we walk through it.</div>
  </div>
  <div id="qrbox"><div id="qr"></div><div class="cap">SCAN TO PLAY</div><div class="url" id="url"></div></div>
</div>
<div id="panel" class="hide"></div>
<div id="awards"></div>
<div id="live"><i></i><span id="livetxt">connecting</span></div>
<div id="miniqr"></div>
<div id="hud">&larr; &rarr; to move &middot; drag and scroll to explore &middot; H hides names &middot; <span id="stopn"></span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// ===== Edit these for presentation day =====
const SPEAKERS = ["Speaker 1", "Speaker 2", "Speaker 3", "Speaker 4"];  // put the four names here
const GAME_URL = "https://patjlong.github.io/ciso-ladder/play/?class=1";  // class build: voices off by default, tighter pacing
const TALLY = "https://ntfy.sh/ciso-ladder-5b65593fe27f21f7";            // same relay the game posts to
// ===========================================
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const $ = s => document.querySelector(s);
// which endings a flag pushes toward (a flag can bar more than one: blaming an employee costs both CISO seats)
const FLAG_ENDING = { hid_breach: ["a", "bad"], blamed_employee: [["f", "bad"], ["c", "bad"]], business_brief: ["f", "good"], called_fbi: ["f", "good"],
                      end_outside: ["c", "good"], end_indie: ["d", "good"], end_tools: ["e", "good"], end_fight: ["f", "good"], end_silent: ["g", "bad"] };
const BAD = new Set(["hid_breach", "blamed_employee", "missed_alert", "rubber_stamp", "vendor_bought", "end_silent"]);
let TREE, LENS, cam = { x: 0, y: 0, s: 1 }, cards = {}, optEls = {}, endEls = {};

(async () => {
  [TREE, LENS] = await Promise.all([fetch("tree.json", { cache: "no-cache" }).then(r => r.json()), fetch("lens.json", { cache: "no-cache" }).then(r => r.json()).catch(() => ({}))]);
  new QRCode($("#qr"), { text: GAME_URL, width: 300, height: 300, colorDark: "#07080b", colorLight: "#ffffff" });
  new QRCode($("#miniqr"), { text: GAME_URL, width: 110, height: 110 });
  $("#url").textContent = GAME_URL.replace(/^https:\/\//, "");
  layout(); live(); buildTour(); go(0);
})();

// ---------- story splits: variants of a scene that only play after a particular earlier choice ----------
const atomsOf = w => w.match(/[a-z_][a-z0-9_]*/g) || [];
function holds(w, flags) { const n = atomsOf(w); return !!Function(...n, `return (${w});`)(...n.map(k => !!flags[k])); }
let SPLITS = [];   // { sceneId, firstCid, when, lines, setters: [{cid, opts}], adjacent, el }
function planSplits(order) {
  const pos = Object.fromEntries(order.map((c, i) => [c.id, i]));
  for (const ep of TREE.episodes) for (const sc of ep.scenes) {
    if (!sc.variants || !sc.variants.length || !sc.choices.length) continue;
    const first = sc.choices[0].id;
    for (const v of sc.variants) {
      const atoms = atomsOf(v.when), setters = [];
      for (const c of order) {
        if (pos[c.id] >= pos[first]) break;
        if (!c.options.some(o => o.flag && atoms.includes(o.flag))) continue;  // this decision does not touch the condition
        const opts = c.options.map((o, i) => [o, i]).filter(([o]) => holds(v.when, o.flag ? { [o.flag]: true } : {})).map(([, i]) => i);
        if (opts.length) setters.push({ cid: c.id, opts });
      }
      if (!setters.length) continue;
      const adjacent = setters.length === 1 && pos[setters[0].cid] === pos[first] - 1;
      SPLITS.push({ sceneId: sc.id, firstCid: first, when: v.when, lines: v.lines, setters, adjacent });
    }
  }
}
function variantChip(sp, label) {
  const el = document.createElement("div"); el.className = "variant" + (sp.adjacent ? "" : " cb");
  el.innerHTML = `<div class="vk">${esc(label)}</div>${sp.lines.slice(0, 2).map(([w, t]) => `<div class="vl"><b>${esc(w)}</b> ${esc(t)}</div>`).join("")}`;
  $("#world").appendChild(el); sp.el = el; return el;
}

// ---------- layout: one row per episode, snaking left-right then right-left; where the story splits into
// whole routes the row grows parallel lanes, each opened by a gate card; endings fan out last ----------
const CW = 420, GAP = 260, SPLITW = 400, LANEW = 360, DIAW = 140, LANEH = 1300, ROWMIN = 1750;
let SEGS = [], NEXT = {};   // segments in play order; NEXT[cid] = the element a vote on cid travels to
function laneHead(lane, ep) {
  const el = document.createElement("div"); el.className = "lanehead" + (lane.id === "base" ? " base" : "");
  el.innerHTML = `<div class="lk">${lane.id === "base" ? "Main road" : "Route"} &middot; Ep ${ep.n}</div><div class="lt">${esc(lane.title)}</div><div class="lg">${esc(lane.gate)}</div>`;
  $("#world").appendChild(el); return el;
}
function layout() {
  const world = $("#world");
  const order = TREE.episodes.flatMap(ep => ep.scenes.flatMap(sc => sc.choices));
  planSplits(order);
  const splitBefore = cid => SPLITS.filter(sp => sp.adjacent && sp.firstCid === cid);
  // segments: runs of shared scenes, and runs of lane scenes played side by side
  TREE.episodes.forEach(ep => {
    const segs = [];
    for (const sc of ep.scenes) {
      if (!sc.choices.length) continue;
      const lane = sc.lane || null, last = segs[segs.length - 1];
      let seg = last && (!!last.fork === !!lane) ? last : null;
      if (!seg) { seg = { ep, fork: !!lane, lanes: {} }; segs.push(seg); }
      (seg.lanes[lane || "_"] ||= []).push(...sc.choices.map(c => ({ c, sc })));
    }
    segs.forEach(s => { s.ids = s.fork ? ep.lanes.map(l => l.id).filter(id => s.lanes[id]) : ["_"]; });
    ep.segs = segs; ep.nLanes = Math.max(...segs.map(s => s.ids.length));
  });
  // lanes that carry straight on from the previous episode's lanes (Episode 1 into 2) need no new split
  TREE.episodes.flatMap(ep => ep.segs).forEach((s, i, all) => {
    const prev = all[i - 1]; s.continues = !!(s.fork && prev && prev.fork && prev.ids.join() === s.ids.join());
  });
  // a segment's width: columns of cards (plus split columns), plus the gate column for a fork
  const colsOf = s => Math.max(...s.ids.map(id => s.lanes[id].length));
  const colHasSplit = (s, k) => s.ids.some(id => s.lanes[id][k] && splitBefore(s.lanes[id][k].c.id).length);
  const segW = s => (s.fork ? (s.continues ? 0 : DIAW + GAP) + LANEW + GAP : 0) +
    [...Array(colsOf(s)).keys()].reduce((w, k) => w + CW + GAP + (colHasSplit(s, k) ? SPLITW + GAP : 0), 0) - GAP;
  const rowWidth = ep => ep.segs.reduce((w, s) => w + segW(s) + GAP, -GAP);
  const rowW = Math.max(...TREE.episodes.map(rowWidth));
  const epStarts = [];
  let rowTop = 0;
  TREE.episodes.forEach((ep, r) => {
    const ltr = r % 2 === 0, laneY = k => rowTop + k * LANEH, midY = laneY((ep.nLanes - 1) / 2);
    let cur = ltr ? 0 : rowW;  // ltr: next left edge; rtl: next right edge
    const place = w => { const x = ltr ? cur : cur - w; cur = ltr ? cur + w + GAP : cur - w - GAP; return x; };
    for (const s of ep.segs) {
      const ys = {}; s.ids.forEach((id, k) => ys[id] = s.fork ? laneY(k + (ep.nLanes - s.ids.length) / 2) : midY);
      if (s.fork) {
        // a SPLIT diamond only where the story splits; lanes that carry on from the last episode need none
        if (!s.continues) {
          const dx = place(DIAW), d = document.createElement("div"); d.className = "diamond"; d.innerHTML = "<span>SPLIT</span>";
          d.style.left = (dx + (DIAW - 96) / 2) + "px"; d.style.top = (midY + 250) + "px"; world.appendChild(d); s.diamond = d;
        }
        const hx = place(LANEW); s.heads = {};
        s.ids.forEach(id => { const el = laneHead(ep.lanes.find(l => l.id === id), ep); el.style.left = hx + "px"; el.style.top = (ys[id] + 180) + "px"; s.heads[id] = el; });
      }
      for (let k = 0; k < colsOf(s); k++) {
        if (colHasSplit(s, k)) {  // a column of variant cards: the next scene changes with the last answer, then rejoins
          const x = place(SPLITW);
          s.ids.forEach(id => {
            const it = s.lanes[id][k]; if (!it) return;
            const splits = splitBefore(it.c.id), H = 150, top = ys[id] + 330 - ((splits.length - 1) * H) / 2;
            splits.forEach((sp, i) => {
              const setter = cards[sp.setters[0].cid];
              const el = variantChip(sp, "If you chose: " + sp.setters[0].opts.map(j => setter.c.options[j].t).join(" / "));
              el.style.left = (x + (SPLITW - 380) / 2) + "px"; el.style.top = (top + i * H) + "px";
            });
          });
        }
        const x = place(CW);
        s.ids.forEach(id => {
          const it = s.lanes[id][k]; if (!it) return;
          const { c, sc } = it, y = ys[id], L = LENS[c.id] || {};
          const el = document.createElement("div"); el.className = "card" + (sc.lane && sc.lane !== "base" ? " route" : ""); el.style.left = x + "px"; el.style.top = y + "px";
          el.innerHTML = `<img src="stills/${c.id.replace("#", "_")}.webp" alt="" onerror="this.style.display='none'">
            <div class="hd"><span class="sc">${esc(sc.name)}</span><span class="id">Ep ${ep.n} &middot; ${esc(c.id)}${c.timed ? `<span class="timed">${c.timed}s timer</span>` : ""}</span></div>
            ${L.skill ? `<span class="skill">${esc(L.skill)}</span>` : ""}
            ${L.real ? `<div class="real">${esc(L.real)}</div>` : ""}
            <div class="opts">${c.options.map((o, i) => {
              const pc = (L.opts || [])[i];
              return `<div class="opt" data-c="${c.id}" data-o="${i}"><div class="t"><span>${esc(o.t)}${o.flag ? `<span class="flag ${BAD.has(o.flag) ? "bad" : ""}">${esc(o.flag.replace(/_/g, " "))}</span>` : ""}</span><span class="n" data-n></span></div>
                ${pc ? `<div class="pc"><b>+ ${esc(pc.pro)}</b> &middot; <i>- ${esc(pc.con)}</i></div>` : ""}<div class="bar"><span></span></div></div>`;
            }).join("")}</div>`;
          world.appendChild(el); cards[c.id] = { el, x, y, c, ep, lane: sc.lane };
        });
      }
      SEGS.push(s);
    }
    const h = document.createElement("div"); h.className = "ephead"; h.style.left = (ltr ? 0 : rowW - 1400) + "px"; h.style.top = (rowTop - 250) + "px"; h.style.fontSize = "92px";
    if (!ltr) h.style.textAlign = "right", h.style.width = "1400px";
    const titles = ep.nLanes > 1 ? ep.lanes.map(l => l.title).join(" / ") : ep.title;
    h.innerHTML = `Episode ${ep.n}: ${esc(ep.nLanes > 1 && ep.n !== 1 ? titles : ep.title)}<small>${esc(ep.rung)} &middot; ${esc(ep.role)} &middot; ${esc(ep.years)}</small>`;
    world.appendChild(h);
    const rowH = Math.max(ROWMIN, (ep.nLanes - 1) * LANEH + ROWMIN);
    epStarts.push({ ep, y: rowTop, h: rowH - 600, x0: 0, x1: rowW });
    rowTop += rowH;
  });
  // long-range callbacks hang under the decision card of the scene they play in
  const under = {};
  SPLITS.filter(sp => !sp.adjacent).forEach(sp => {
    const label = "Callback: " + sp.setters.map(st => st.opts.map(k => cards[st.cid].c.options[k].t).join(" / ")).join(" or ");
    variantChip(sp, label); (under[sp.firstCid] ||= []).push(sp);
  });
  requestAnimationFrame(() => {
    for (const [cid, list] of Object.entries(under)) {
      const c = cards[cid].el; let yy = c.offsetTop + c.offsetHeight + 40;
      list.forEach(sp => { sp.el.style.left = (c.offsetLeft + 20) + "px"; sp.el.style.top = yy + "px"; yy += sp.el.offsetHeight + 16; });
    }
    drawLinks();
  });

      for (const tr of (TRAITS[cid] || [])[o] || []) { r.t[tr] = (r.t[tr] || 0) + 1; (r.ex[tr] ||= []).push(cid + "|" + o); }
      for (const [k, v] of Object.entries(opt.fx || {})) if (k in r.stat) r.stat[k] += v;
      if (ms) {
        r.ms.push(ms); (r.picksMs ||= {})[cid] = ms;
        if (!r.slowMs || ms > r.slowMs) { r.slowMs = ms; r.slowest = cid + "|" + o; }
        if (!r.quickMs || ms < r.quickMs) { r.quickMs = ms; r.quickest = cid + "|" + o; }
      }
    }
    r.ms.sort((a, b) => a - b); r.med = r.ms.length >= 3 ? r.ms[r.ms.length >> 1] / 1000 : null;
    (names[r.base] ||= []).push(r); rows.push(r);
  }
  // two players named Avery get told apart by a short tag; H on the keyboard swaps every name for a number
  for (const list of Object.values(names)) list.forEach(r => { r.name = list.length > 1 ? `${r.base} #${r.s.slice(-3)}` : r.base; });
  if (HIDE_NAMES) rows.slice().sort((a, b) => a.s < b.s ? -1 : 1).forEach((r, i) => { r.name = `Player ${i + 1}`; });
  return rows;
}
function winners(rows, a) {
  const val = r => a.time ? r.med : a.stat ? r.stat[a.stat] : (r.t[a.k] || 0);
  const ok = rows.filter(r => { const v = val(r); return v !== null && v !== undefined && (a.time || a.stat || v > 0); });
  if (!ok.length) return null;
  ok.sort((x, y) => a.time === "fast" ? val(x) - val(y) : val(y) - val(x));
  const top = val(ok[0]), tied = ok.filter(r => val(r) === top).slice(0, 3);
  return { top, tied, next: ok.filter(r => val(r) !== top).slice(0, 2).map(r => ({ name: r.name, v: val(r) })) };
}
let awardTimer = null, awardAt = 0;
function showAwards(on) {
  const box = $("#awards"); clearInterval(awardTimer);
  box.classList.toggle("on", on); if (!on) return;
  awardAt = 0; drawAward();
  awardTimer = setInterval(() => { awardAt++; drawAward(); }, 6500);
}
function drawAward() {
  const box = $("#awards"), rows = scoreAll();
  const list = AWARDS.map(a => ({ a, w: winners(rows, a) })).filter(x => x.w);
  if (!list.length) {
    box.innerHTML = `<div class="aw"><div class="ak">Class awards</div><div class="at">Waiting for players</div><div class="as">Scan the code and play. Awards appear once someone has made a few decisions.</div></div>`;
    return;
  }
  const { a, w } = list[awardAt % list.length];
  const fmt = v => a.time ? v.toFixed(1) : Math.round(v);
  // Exhibit A: one real pick behind the award (for the clock awards, their slowest or quickest call)
  const lead = w.tied[0], exKey = a.time ? lead[a.time === "slow" ? "slowest" : "quickest"] : (lead.ex[a.k] || [])[0];
  let ex = "";
  if (exKey) {
    const [cid, o] = exKey.split("|"), c = cards[cid], opt = optionAt(cid, +o);
    const took = a.time ? ` in ${(lead.picksMs[cid] / 1000).toFixed(1)}s` : "";
    if (c && opt) ex = `<div class="ae"><span>Exhibit A</span> "${esc(opt.t)}"${took} <i>Episode ${c.ep.n}, ${esc(c.c.id)}</i></div>`;
    box.style.setProperty("--still", `url("stills/${cid.replace("#", "_")}.webp")`);
  } else box.style.setProperty("--still", "none");
  box.innerHTML = `<div class="aw" key="${awardAt}">
    <div class="ak">Class awards &middot; ${list.length ? (awardAt % list.length) + 1 : 0} of ${list.length} &middot; ${rows.length} players</div>
    <div class="at">${esc(a.title)}</div>
    <div class="aname">${w.tied.map(r => esc(r.name)).join(" &amp; ")}</div>
    <div class="av">${fmt(w.top)} ${esc(a.unit)}</div>
    <div class="as">${esc(a.sub)}</div>${ex}
    ${w.next.length ? `<div class="ar">Runners-up: ${w.next.map(r => `${esc(r.name)} (${fmt(r.v)})`).join(", ")}</div>` : ""}
    <div class="adots">${list.map((_, i) => `<i class="${i === awardAt % list.length ? "on" : ""}"></i>`).join("")}</div></div>`;
  gsap.fromTo("#awards .aw > *", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: .6, stagger: .07, ease: "power3.out" });
  gsap.fromTo("#awards .aname", { scale: .85 }, { scale: 1, duration: .9, ease: "back.out(2)" });
}
