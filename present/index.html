<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The CISO Ladder: Decision Map</title>
<meta name="description" content="The full decision tree of The CISO Ladder with live class results. CIS 424, Purple Protocol, Sprint 2.">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080b;--panel:#0f1117;--line:#2a2e38;--text:#f2f3f5;--muted:#b7bdc8;--gold:#e8b33a;--red:#e2554b;--teal:#7fd1c7}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.75) 100%)}
#viewport{position:fixed;inset:0;cursor:grab}#viewport.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
svg#links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.card{position:absolute;width:420px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.6);transition:border-color .3s,box-shadow .3s}
.card.focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(232,179,58,.35),0 30px 70px rgba(0,0,0,.7)}
.card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.card .hd{padding:12px 14px 4px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .sc{font-family:"Bebas Neue";font-size:24px;letter-spacing:.05em}
.card .id{color:var(--muted);font-size:12px;white-space:nowrap}
.card .skill{margin:0 14px;display:inline-block;color:#111;background:var(--gold);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:2px}
.card .real{padding:8px 14px 4px;color:#d9dce2;font-size:13.5px;line-height:1.45}
.card .timed{color:var(--red);font-size:11px;letter-spacing:.15em;text-transform:uppercase;margin-left:6px}
.opts{padding:6px 10px 12px}
.opt{padding:7px 8px;border-radius:4px;margin-top:5px;background:#151821;position:relative}
.opt .t{font-weight:700;font-size:13.5px;display:flex;justify-content:space-between;gap:6px}
.opt .pc{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}.opt .pc b{color:var(--teal);font-weight:500}.opt .pc i{color:#f0a59e;font-style:normal}
.opt .bar{height:4px;background:#22252d;border-radius:2px;margin-top:5px;overflow:hidden}.opt .bar span{display:block;height:100%;width:0;background:var(--gold);transition:width .8s ease}
.opt .n{color:var(--gold);font-size:12px;font-weight:700}
.opt .flag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#111;background:var(--teal);padding:1px 5px;border-radius:2px;margin-left:4px}
.opt .flag.bad{background:var(--red)}
.opt.hit{animation:hit 1.2s ease-out}
@keyframes hit{0%{background:#5a4718;box-shadow:0 0 0 2px #e8b33a}100%{background:#151821;box-shadow:0 0 0 0 transparent}}
.card.ping{animation:ping 1.1s ease-out}
@keyframes ping{0%{box-shadow:0 0 0 3px #e8b33a,0 0 40px #e8b33a}100%{box-shadow:0 20px 50px rgba(0,0,0,.6)}}
.opt .n{white-space:nowrap}
.variant{position:absolute;width:380px;background:#14111f;border:1px solid #5b4b8f;border-radius:6px;padding:10px 12px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.variant.cb{border-style:dashed}
.variant .vk{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#b39cff;margin-bottom:5px}
.variant .vl{font-size:13px;line-height:1.4;color:#e6e2f3;margin-top:3px}.variant .vl b{color:#d9c8ff;font-weight:700;margin-right:4px}
.ephead{position:absolute;font-family:"Bebas Neue";color:var(--gold);letter-spacing:.06em;white-space:nowrap}
.ephead small{display:block;font-family:Inter;color:var(--muted);font-size:20px;letter-spacing:0}
.ending{position:absolute;width:380px;background:#121008;border:1px solid #5a4a1c;border-radius:8px;overflow:hidden}
.ending img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;opacity:.9}
.ending .sc{font-family:"Bebas Neue";font-size:30px;padding:10px 14px 0;color:var(--gold)}
.ending p{padding:4px 14px 12px;font-size:13px;color:#ddd;line-height:1.45}.ending .n{color:var(--gold);font-weight:700;font-size:13px;padding:0 14px 12px}
/* fixed overlay panels for tour stops */
#panel{position:fixed;left:3vw;bottom:5vh;width:min(560px,92vw);background:rgba(8,9,12,.9);border:1px solid var(--line);border-radius:8px;padding:20px 22px;backdrop-filter:blur(6px);transition:opacity .4s;z-index:5}
#panel.hide{opacity:0;pointer-events:none}
#panel .k{color:var(--gold);letter-spacing:.35em;font-size:12px;text-transform:uppercase}
#panel h2{font-family:"Bebas Neue";font-weight:400;font-size:44px;line-height:1;margin:6px 0 8px}
#panel p,#panel li{color:#dfe2e8;line-height:1.5;font-size:15px}#panel ul,#panel ol{padding-left:20px}#panel li{margin-top:4px}
#panel .speaker{float:right;color:#111;background:var(--teal);font-weight:700;font-size:12px;padding:3px 8px;border-radius:2px}
#panel .src{color:var(--muted);font-size:12px;margin-top:8px}
#hero{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:6vw;z-index:6;background:radial-gradient(ellipse at 30% 40%,#1a1508,#07080b 70%);transition:opacity .6s}
#hero.hide{opacity:0;pointer-events:none}
#hero h1{font-family:"Bebas Neue";font-weight:400;font-size:clamp(64px,9vw,150px);line-height:.9;letter-spacing:.04em}#hero h1 span{color:var(--gold)}
#hero .sub{color:var(--muted);margin-top:14px;font-size:18px;max-width:520px}
#qrbox{background:#fff;padding:18px;border-radius:10px;text-align:center}
#qrbox .cap{color:#111;font:700 18px Inter;margin-top:10px;letter-spacing:.05em}#qrbox .url{color:#333;font-size:13px;margin-top:4px}
#live{position:fixed;top:16px;right:18px;z-index:7;background:rgba(8,9,12,.85);border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:13px;display:flex;gap:8px;align-items:center}
#live i{width:9px;height:9px;border-radius:50%;background:#555}#live.on i{background:#3fd27a;box-shadow:0 0 8px #3fd27a}
#hud{position:fixed;bottom:14px;right:18px;z-index:7;color:var(--muted);font-size:12px}
#miniqr{position:fixed;top:56px;right:18px;z-index:7;background:#fff;padding:6px;border-radius:6px;display:none}#miniqr.on{display:block}
@media (max-width:760px){#hero{flex-direction:column;gap:24px;padding:20px;text-align:center}#panel{left:4vw;bottom:2vh;padding:14px}#panel h2{font-size:32px}}
</style>
</head>
<body>
<div id="viewport"><div id="world"><svg id="links"></svg></div></div>
<div id="hero">
  <div>
    <h1>THE <span>CISO</span><br>LADDER</h1>
    <div class="sub">Scan the code and play. Every choice you make shows up on this map, live, as we walk through it.</div>
  </div>
  <div id="qrbox"><div id="qr"></div><div class="cap">SCAN TO PLAY</div><div class="url" id="url"></div></div>
</div>
<div id="panel" class="hide"></div>
<div id="live"><i></i><span id="livetxt">connecting</span></div>
<div id="miniqr"></div>
<div id="hud">&larr; &rarr; to move &middot; drag and scroll to explore &middot; <span id="stopn"></span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// ===== Edit these for presentation day =====
const SPEAKERS = ["Speaker 1", "Speaker 2", "Speaker 3", "Speaker 4"];  // put the four names here
const GAME_URL = "https://patjlong.github.io/ciso-ladder/play/";
const TALLY = "https://ntfy.sh/ciso-ladder-5b65593fe27f21f7";            // same relay the game posts to
// ===========================================
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const $ = s => document.querySelector(s);
const FLAG_ENDING = { hid_breach: ["a", "bad"], blamed_employee: ["f", "bad"], business_brief: ["f", "good"], called_fbi: ["f", "good"],
                      end_outside: ["c", "good"], end_indie: ["d", "good"], end_tools: ["e", "good"], end_fight: ["f", "good"], end_silent: ["g", "bad"] };
const BAD = new Set(["hid_breach", "blamed_employee", "missed_alert", "rubber_stamp", "vendor_bought", "end_silent"]);
let TREE, LENS, cam = { x: 0, y: 0, s: 1 }, cards = {}, optEls = {}, endEls = {};

(async () => {
  [TREE, LENS] = await Promise.all([fetch("tree.json").then(r => r.json()), fetch("lens.json").then(r => r.json()).catch(() => ({}))]);
  new QRCode($("#qr"), { text: GAME_URL, width: 300, height: 300, colorDark: "#07080b", colorLight: "#ffffff" });
  new QRCode($("#miniqr"), { text: GAME_URL, width: 110, height: 110 });
  $("#url").textContent = GAME_URL.replace(/^https:\/\//, "");
  layout(); live(); buildTour(); go(0);
})();

// ---------- story splits: variants of a scene that only play after a particular earlier choice ----------
const atomsOf = w => w.match(/[a-z_][a-z0-9_]*/g) || [];
function holds(w, flags) { const n = atomsOf(w); return !!Function(...n, `return (${w});`)(...n.map(k => !!flags[k])); }
let SPLITS = [];   // { sceneId, firstCid, when, lines, setters: [{cid, opts}], adjacent, el }
function planSplits(order) {
  const pos = Object.fromEntries(order.map((c, i) => [c.id, i]));
  for (const ep of TREE.episodes) for (const sc of ep.scenes) {
    if (!sc.variants || !sc.variants.length || !sc.choices.length) continue;
    const first = sc.choices[0].id;
    for (const v of sc.variants) {
      const atoms = atomsOf(v.when), setters = [];
      for (const c of order) {
        if (pos[c.id] >= pos[first]) break;
        if (!c.options.some(o => o.flag && atoms.includes(o.flag))) continue;  // this decision does not touch the condition
        const opts = c.options.map((o, i) => [o, i]).filter(([o]) => holds(v.when, o.flag ? { [o.flag]: true } : {})).map(([, i]) => i);
        if (opts.length) setters.push({ cid: c.id, opts });
      }
      if (!setters.length) continue;
      const adjacent = setters.length === 1 && pos[setters[0].cid] === pos[first] - 1;
      SPLITS.push({ sceneId: sc.id, firstCid: first, when: v.when, lines: v.lines, setters, adjacent });
    }
  }
}
function variantChip(sp, label) {
  const el = document.createElement("div"); el.className = "variant" + (sp.adjacent ? "" : " cb");
  el.innerHTML = `<div class="vk">${esc(label)}</div>${sp.lines.slice(0, 2).map(([w, t]) => `<div class="vl"><b>${esc(w)}</b> ${esc(t)}</div>`).join("")}`;
  $("#world").appendChild(el); sp.el = el; return el;
}

// ---------- layout: one row per episode, snaking left-right then right-left; endings fan out last ----------
const CW = 420, GAP = 260, SPLITW = 400, ROWH = 1750;
function layout() {
  const world = $("#world");
  const order = TREE.episodes.flatMap(ep => ep.scenes.flatMap(sc => sc.choices));
  planSplits(order);
  const splitBefore = cid => SPLITS.filter(sp => sp.adjacent && sp.firstCid === cid);
  // row widths include the extra split columns
  const rowWidth = ep => ep.scenes.flatMap(sc => sc.choices).reduce((w, c) => w + CW + GAP + (splitBefore(c.id).length ? SPLITW + GAP : 0), -GAP);
  const rowW = Math.max(...TREE.episodes.map(rowWidth));
  const epStarts = [];
  TREE.episodes.forEach((ep, r) => {
    const y = r * ROWH, ltr = r % 2 === 0;
    let cur = ltr ? 0 : rowW;  // ltr: next left edge; rtl: next right edge
    const place = w => { const x = ltr ? cur : cur - w; cur = ltr ? cur + w + GAP : cur - w - GAP; return x; };
    for (const sc of ep.scenes) for (const c of sc.choices) {
      const splits = splitBefore(c.id);
      if (splits.length) {  // a column of variant cards: the story splits here, then rejoins
        const x = place(SPLITW), H = 150, top = y + 330 - ((splits.length - 1) * H) / 2;
        splits.forEach((sp, i) => {
          const setter = cards[sp.setters[0].cid];
          const label = "If you chose: " + sp.setters[0].opts.map(k => setter.c.options[k].t).join(" / ");
          const el = variantChip(sp, label); el.style.left = (x + (SPLITW - 380) / 2) + "px"; el.style.top = (top + i * H) + "px";
        });
      }
      const x = place(CW);
      const L = LENS[c.id] || {};
      const el = document.createElement("div"); el.className = "card"; el.style.left = x + "px"; el.style.top = y + "px";
      el.innerHTML = `<img src="stills/${c.id.replace("#", "_")}.webp" alt="">
        <div class="hd"><span class="sc">${esc(sc.name)}</span><span class="id">Ep ${ep.n} &middot; ${esc(c.id)}${c.timed ? `<span class="timed">${c.timed}s timer</span>` : ""}</span></div>
        ${L.skill ? `<span class="skill">${esc(L.skill)}</span>` : ""}
        ${L.real ? `<div class="real">${esc(L.real)}</div>` : ""}
        <div class="opts">${c.options.map((o, i) => {
          const pc = (L.opts || [])[i];
          return `<div class="opt" data-c="${c.id}" data-o="${i}"><div class="t"><span>${esc(o.t)}${o.flag ? `<span class="flag ${BAD.has(o.flag) ? "bad" : ""}">${esc(o.flag.replace(/_/g, " "))}</span>` : ""}</span><span class="n" data-n></span></div>
            ${pc ? `<div class="pc"><b>+ ${esc(pc.pro)}</b> &middot; <i>- ${esc(pc.con)}</i></div>` : ""}<div class="bar"><span></span></div></div>`;
        }).join("")}</div>`;
      world.appendChild(el); cards[c.id] = { el, x, y, c, ep };
    }
    const h = document.createElement("div"); h.className = "ephead"; h.style.left = (ltr ? 0 : rowW - 1400) + "px"; h.style.top = (y - 250) + "px"; h.style.fontSize = "92px";
    if (!ltr) h.style.textAlign = "right", h.style.width = "1400px";
    h.innerHTML = `Episode ${ep.n}: ${esc(ep.title)}<small>${esc(ep.rung)} &middot; ${esc(ep.role)} &middot; ${esc(ep.years)}</small>`;
    world.appendChild(h);
    epStarts.push({ ep, y, x0: 0, x1: rowW });
  });
  // long-range callbacks hang under the decision card of the scene they play in
  const under = {};
  SPLITS.filter(sp => !sp.adjacent).forEach(sp => {
    const label = "Callback: " + sp.setters.map(st => st.opts.map(k => cards[st.cid].c.options[k].t).join(" / ")).join(" or ");
    variantChip(sp, label); (under[sp.firstCid] ||= []).push(sp);
  });
  requestAnimationFrame(() => {
    for (const [cid, list] of Object.entries(under)) {
      const c = cards[cid].el; let yy = c.offsetTop + c.offsetHeight + 40;
      list.forEach(sp => { sp.el.style.left = (c.offsetLeft + 20) + "px"; sp.el.style.top = yy + "px"; yy += sp.el.offsetHeight + 16; });
    }
    drawLinks();
  });
  // endings fan out to the right of the last row
  const lastY = (TREE.episodes.length - 1) * ROWH, ex = rowW + 520, EH = 430, n = TREE.endings.length;
  TREE.endings.forEach((en, i) => {
    const key = en.id + en.name.split(" ")[0], L = LENS[key] || {}, k = en.name.split(" ")[0];
    const y = lastY + 300 - ((n - 1) * EH) / 2 + i * EH;
    const el = document.createElement("div"); el.className = "ending"; el.style.left = ex + "px"; el.style.top = y + "px";
    el.innerHTML = `<img src="stills/end_${k}.webp" alt=""><div class="sc">${esc(en.name.replace(/^[a-g]\s+/, ""))}</div>
      <p>${esc(L.path || "")}</p><div class="n" data-end="${k}"></div>`;
    world.appendChild(el); endEls[k] = { el, x: ex, y };
  });
  TREE.width = ex + 380; TREE.height = lastY + 300 + (n * EH) / 2 + 400; TREE.top = Math.min(-300, lastY + 300 - (n * EH) / 2);
  TREE.epStarts = epStarts;
}

// ---------- links: options fan to the next decision, split into story variants where the story changes,
// reach back across episodes for callbacks, and arc to the endings they decide ----------
function sideOf(el, toward) {  // the point on el's edge facing `toward`
  const r = { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };
  if (Math.abs(toward.y - (r.y + r.h / 2)) > r.h) return { x: r.x + r.w / 2, y: toward.y > r.y ? r.y + r.h : r.y };
  return { x: toward.x > r.x + r.w / 2 ? r.x + r.w : r.x, y: r.y + Math.min(120, r.h / 2) };
}
function optPos(cid, i, toward) {
  const el = cards[cid].el, o = el.querySelectorAll(".opt")[i], y = el.offsetTop + o.offsetTop + o.offsetHeight / 2;
  if (Math.abs(toward.y - y) > 700) return { x: el.offsetLeft + el.offsetWidth / 2 + (i - 1.5) * 40, y: el.offsetTop + el.offsetHeight };
  return { x: toward.x > el.offsetLeft ? el.offsetLeft + el.offsetWidth : el.offsetLeft, y };
}
// every branch is addressable: branchId(cid, option) is the path a vote travels along
const branchId = (cid, i) => `b-${cid.replace(/[#.]/g, "_")}-${i}`;
function drawLinks() {
  const svg = $("#links"), ids = Object.keys(cards); let d = "";
  svg.setAttribute("width", TREE.width); svg.setAttribute("height", TREE.height);
  const curve = (a, b, cls, w, id) => {
    const c = Math.abs(a.y - b.y) > Math.abs(a.x - b.x)
      ? `C${a.x},${(a.y + b.y) / 2} ${b.x},${(a.y + b.y) / 2} ${b.x},${b.y}` : `C${(a.x + b.x) / 2},${a.y} ${(a.x + b.x) / 2},${b.y} ${b.x},${b.y}`;
    return `<path ${id ? `id="${id}"` : ""} d="M${a.x},${a.y} ${c}" class="${cls}" stroke-width="${w}" vector-effect="non-scaling-stroke" fill="none"/>`;
  };
  for (let k = 0; k < ids.length - 1; k++) {
    const nx = cards[ids[k + 1]].el, cur = cards[ids[k]].el, cid = ids[k];
    const target = sideOf(nx, { x: cur.offsetLeft + cur.offsetWidth / 2, y: cur.offsetTop + 200 });
    const splits = SPLITS.filter(sp => sp.adjacent && sp.setters[0].cid === cid);
    cards[cid].c.options.forEach((o, i) => {
      const sp = splits.find(s => s.setters[0].opts.includes(i));
      if (sp) {  // the story splits: this option's branch runs to its own version of the next scene
        const chipIn = sideOf(sp.el, { x: cur.offsetLeft + cur.offsetWidth / 2, y: sp.el.offsetTop + 40 });
        d += curve(optPos(cid, i, chipIn), chipIn, "l split", 2.5, branchId(cid, i));
      } else d += curve(optPos(cid, i, target), target, "l", 2, branchId(cid, i));
    });
    splits.forEach(sp => {  // and the versions rejoin at the next decision
      const out = sideOf(sp.el, target); d += curve(out, target, "l rejoin", 2.5);
    });
  }
  // callbacks: a choice made episodes ago changes a line here
  SPLITS.filter(sp => !sp.adjacent).forEach(sp => sp.setters.forEach(st => st.opts.forEach(i => {
    const tgt = { x: sp.el.offsetLeft, y: sp.el.offsetTop + 30 };
    d += curve(optPos(st.cid, i, tgt), tgt, "l cbk", 2);
  })));
  const last = ids[ids.length - 1];
  for (const cid of ids) cards[cid].c.options.forEach((o, i) => {
    const f = FLAG_ENDING[o.flag]; if (!f) return;
    const e = endEls[f[0]], tgt = { x: e.x, y: e.y + 110 };
    d += curve(optPos(cid, i, tgt), tgt, cid === last ? "l end" : `l arc ${f[1]}`, cid === last ? 3 : 2.5, cid === last ? branchId(cid, i) : null);
  });
  svg.innerHTML = `<style>.l{stroke:#565c6b;opacity:.85;transition:stroke-width .8s,opacity .8s}.l.hot{stroke:#e8b33a}.end{stroke:#e8b33a}
    .split{stroke:#b39cff}.rejoin{stroke:#6d5f99;opacity:.7}.cbk{stroke:#b39cff;stroke-dasharray:4 9;opacity:.55}
    .arc{stroke-dasharray:14 10;opacity:.6}.arc.bad{stroke:#e2554b}.arc.good{stroke:#7fd1c7}</style>${d}<g id="sparks"></g>`;
  Object.keys(votes).forEach(paint);
}

// ---------- camera ----------
const world = $("#world");
function apply() { world.style.transform = `translate(${-cam.x * cam.s + innerWidth / 2}px, ${-cam.y * cam.s + innerHeight / 2}px) scale(${cam.s})`; }
function fly(x, y, s, dur = 1.6) { gsap.to(cam, { x, y, s, duration: dur, ease: "power3.inOut", onUpdate: apply }); }
function fitBox(x0, y0, x1, y1, pad = 1.15) {
  const s = Math.min(innerWidth / ((x1 - x0) * pad), innerHeight / ((y1 - y0) * pad));
  fly((x0 + x1) / 2, (y0 + y1) / 2, Math.min(s, 1.4));
}
function focusCard(cid) {
  document.querySelectorAll(".card.focus").forEach(e => e.classList.remove("focus"));
  const c = cards[cid]; if (!c) return; c.el.classList.add("focus");
  const r = { x: c.el.offsetLeft, y: c.el.offsetTop, w: c.el.offsetWidth, h: c.el.offsetHeight };
  const s = Math.min(1.35, innerHeight / (r.h * 1.15));
  fly(r.x + r.w / 2 + (innerWidth > 900 ? -innerWidth * .18 / s : 0), r.y + r.h / 2, s);
}
// free exploring: drag and wheel
let drag = null;
$("#viewport").addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y }; $("#viewport").classList.add("drag"); gsap.killTweensOf(cam); });
addEventListener("pointermove", e => { if (!drag) return; cam.x = drag.cx - (e.clientX - drag.x) / cam.s; cam.y = drag.cy - (e.clientY - drag.y) / cam.s; apply(); });
addEventListener("pointerup", () => { drag = null; $("#viewport").classList.remove("drag"); });
$("#viewport").addEventListener("wheel", e => { e.preventDefault(); gsap.killTweensOf(cam); cam.s = Math.max(.05, Math.min(2.5, cam.s * (e.deltaY < 0 ? 1.12 : 1 / 1.12))); apply(); }, { passive: false });

// ---------- live class results from the relay (12-hour window, one vote per playthrough per choice) ----------
const votes = {}, seen = new Set(), sessions = new Set(), endings = {};
function record(m, fly = true) {
  if (!m || !m.c || typeof m.o !== "number" || !m.s || !cards[m.c]) return;  // only real game choices count
  sessions.add(m.s);
  const key = m.s + "|" + m.c; if (seen.has(key)) return; seen.add(key);
  (votes[m.c] ||= {})[m.o] = (votes[m.c][m.o] || 0) + 1;
  if (m.c === "5.8#1") { const f = ["c", "f", "d", "e", "g"][m.o]; if (f) endings[f] = (endings[f] || 0) + 1; }
  render(m.c);
  if (fly) spark(m.c, m.o);
}
function render(cid) {
  const v = votes[cid] || {}, total = Object.values(v).reduce((a, b) => a + b, 0);
  document.querySelectorAll(`.opt[data-c="${CSS.escape(cid)}"]`).forEach(el => {
    const n = v[el.dataset.o] || 0;
    el.querySelector(".bar span").style.width = total ? (100 * n / total) + "%" : "0";
    el.querySelector("[data-n]").textContent = total ? `${n} · ${Math.round(100 * n / total)}%` : "";
  });
  for (const [k, n] of Object.entries(endings)) { const e = document.querySelector(`[data-end="${k}"]`); if (e) e.textContent = `${n} classmate${n === 1 ? "" : "s"} headed here`; }
  $("#livetxt").textContent = `${sessions.size} playing`;
  paint(cid);
}
// branches thicken and turn gold with the share of the class that took them
function paint(cid) {
  const v = votes[cid] || {}, total = Object.values(v).reduce((a, b) => a + b, 0);
  (cards[cid]?.c.options || []).forEach((o, i) => {
    const p = document.getElementById(branchId(cid, i)); if (!p || !total) return;
    const share = (v[i] || 0) / total;
    p.classList.toggle("hot", share > 0);
    p.setAttribute("stroke-width", (2 + 9 * share).toFixed(1));
    p.style.opacity = share > 0 ? (.45 + .55 * share).toFixed(2) : ".5";
  });
}
// a glowing light runs the branch a classmate just took, then pings the next decision
function spark(cid, o) {
  const path = document.getElementById(branchId(cid, o)), g = document.getElementById("sparks");
  const opt = document.querySelector(`.opt[data-c="${CSS.escape(cid)}"][data-o="${o}"]`);
  if (opt) { opt.classList.remove("hit"); void opt.offsetWidth; opt.classList.add("hit"); }
  if (!path || !g) return;
  const NS = "http://www.w3.org/2000/svg", len = path.getTotalLength(), dots = [];
  for (let k = 0; k < 4; k++) {  // a bright head and a fading tail
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("fill", k === 0 ? "#fff3c4" : "#e8b33a"); c.style.opacity = [1, .55, .32, .16][k];
    g.appendChild(c); dots.push(c);
  }
  const halo = document.createElementNS(NS, "circle"); halo.setAttribute("fill", "#e8b33a"); halo.style.opacity = .3; g.insertBefore(halo, dots[0]);
  const dur = 1700 + Math.random() * 500, t0 = performance.now();
  (function step(now) {
    const t = Math.min(1, (now - t0) / dur), e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2, r = 9 / cam.s;
    dots.forEach((c, k) => {
      const pt = path.getPointAtLength(Math.max(0, e - k * .035) * len);
      c.setAttribute("cx", pt.x); c.setAttribute("cy", pt.y); c.setAttribute("r", r * (1 - k * .18));
    });
    const h = path.getPointAtLength(e * len); halo.setAttribute("cx", h.x); halo.setAttribute("cy", h.y); halo.setAttribute("r", r * 3.3);
    if (t < 1) return requestAnimationFrame(step);
    dots.concat(halo).forEach(c => c.remove());
    const ids = Object.keys(cards), nx = cards[ids[ids.indexOf(cid) + 1]];
    if (nx) { nx.el.classList.remove("ping"); void nx.el.offsetWidth; nx.el.classList.add("ping"); }
  })(t0);
}
function live() {
  // earlier votes replay as a shower of lights when the map opens, then live votes fly as they land
  fetch(`${TALLY}/json?poll=1&since=12h`).then(r => r.text()).then(t => {
    const past = [];
    t.split("\n").forEach(l => { try { past.push(JSON.parse(JSON.parse(l).message)); } catch {} });
    past.forEach(m => record(m, false));
    past.filter(m => m && cards[m.c]).slice(-120).forEach((m, k) => setTimeout(() => spark(m.c, m.o), 400 + k * 140));
  }).catch(() => {});
  const es = new EventSource(`${TALLY}/sse`);
  es.onopen = () => { $("#live").classList.add("on"); if (!sessions.size) $("#livetxt").textContent = "live, waiting for players"; };
  es.onerror = () => $("#live").classList.remove("on");
  es.onmessage = e => { try { record(JSON.parse(JSON.parse(e.data).message), true); } catch {} };
}

// ---------- the tour: arrow keys move through the presentation ----------
let STOPS = [], at = 0;
function panel(html) { const p = $("#panel"); p.classList.add("hide"); setTimeout(() => { p.innerHTML = html; p.classList.toggle("hide", !html); }, html ? 350 : 0); }
function buildTour() {
  const S = SPEAKERS, all = () => fitBox(-200, TREE.top - 200, TREE.width + 100, TREE.height);
  const ep = n => { const r = TREE.epStarts[n - 1]; fitBox(r.x0 - 100, r.y - 300, r.x1 + 100, r.y + 1000); };
  const key = (cid, k, title, body, sp) => ({ go: () => focusCard(cid), html: `<span class="speaker">${S[sp]}</span><div class="k">${k}</div><h2>${title}</h2>${body}` });
  STOPS = [
    { go: () => { $("#hero").classList.remove("hide"); $("#miniqr").classList.remove("on"); }, html: "" },
    { go: () => { $("#hero").classList.add("hide"); $("#miniqr").classList.add("on"); all(); },
      html: `<span class="speaker">${S[0]}</span><div class="k">Backlog item 13</div><h2>The CISO Career Ladder</h2>
      <p>The assignment asks what the path to Fortune 500 CISO looks like at the entry, mid-career and executive levels. We turned that ladder into a game you climb with your own decisions.</p>
      <ul><li><b>Entry:</b> SOC and GRC analyst roles, Security+ and ISC2 CC. BLS median pay for information security analysts is $129,180 (May 2025), with 21% projected growth from 2025 to 2035.</li>
      <li><b>Mid-career:</b> engineer, IR lead or manager, CISSP (5 years of paid experience required).</li>
      <li><b>Executive:</b> director, VP, CISO. IANS / Artico 2025: median CISO total compensation of $532,000 at US enterprises over $1B in revenue.</li></ul>
      <div class="src">Sources: BLS Occupational Outlook Handbook; IANS Research and Artico Search 2025; ISC2.</div>` },
    { go: all, html: `<span class="speaker">${S[1]}</span><div class="k">The map</div><h2>5 episodes, 38 decisions, 7 endings</h2>
      <p>Every gold path is one decision. Each fans out into its options and comes back together, because most choices change your stats and relationships rather than the scene. Then, at the very end, the story splinters into seven endings.</p>
      <p><b style="color:#b39cff">Violet splits</b> are where the story itself changes: after the 3 AM alert and after the AI rollout, each choice runs to its own version of the next scene before the paths rejoin. <b style="color:#b39cff">Dotted violet</b> callbacks reach across episodes, so a choice in year two changes what someone says to you in year ten.</p>
      <p>The dashed red and teal lines decide endings: hiding a breach, blaming an employee, briefing the board in business terms.</p>` },
    { go: () => ep(1), html: `<span class="speaker">${S[1]}</span><div class="k">Entry level &middot; Year 1</div><h2>Episode 1: Night Shift</h2><p>Career fair, the first certification, and a 3 AM alert on the night shift. The first lesson is that containment beats certainty.</p>` },
    key("1.3#1", "Decision 1.3", "The 3 AM alert", `<p>Ten seconds to decide. Isolate, investigate, escalate or freeze. Real SOC playbooks put containment first, but the game lets you feel the pull of each option.</p>`, 1),
    { go: () => ep(2), html: `<span class="speaker">${S[1]}</span><div class="k">Entry level &middot; Years 2 to 4</div><h2>Episode 2: Tier Two</h2><p>Alert fatigue, a vendor promising magic, a nervous new hire and a 2 AM page. Burnout starts adding up here.</p>` },
    { go: () => ep(3), html: `<span class="speaker">${S[2]}</span><div class="k">Mid-career &middot; Years 5 to 8</div><h2>Episode 3: The Middle Rungs</h2><p>The fork between engineer, manager and incident response, the big certification, and the CIO who wants AI everywhere by Friday.</p>` },
    key("3.4#1", "Decision 3.4", "CIO vs CISO", `<p>The tension from our CrowdStrike and CIO vs CISO class discussion: the business has to function, but someone has to ask what data the AI touches. Watch the map split here: each answer leads to a different version of the next scene, and Priya brings it up again in the final interview.</p>`, 2),
    { go: () => ep(4), html: `<span class="speaker">${S[2]}</span><div class="k">Director &middot; Year 9</div><h2>Episode 4: The Breach</h2><p>A help desk phone scam hands attackers an admin tool, modeled on the Twitter case we studied. Contain it, decide on law enforcement, and face the board.</p>` },
    key("4.3#1", "Decision 4.3", "Call the FBI or keep it quiet?", `<p>The law enforcement question from the Twitter case. Keeping it internal feels safe in the moment, but hiding the breach (here or in the press statement) is what ends a career in this game.</p>`, 2),
    { go: () => ep(5), html: `<span class="speaker">${S[3]}</span><div class="k">Executive &middot; Years 10 and up</div><h2>Episode 5: The Corner Office</h2><p>A recruiter, a polished rival and a one-sentence job interview with the CEO. Every earlier choice shows up here.</p>` },
    { go: () => { const es = Object.values(endEls); fitBox(es[0].x - 1500, es[0].y - 200, es[0].x + 480, es[es.length - 1].y + 450); },
      html: `<span class="speaker">${S[3]}</span><div class="k">Where you land</div><h2>Seven endings</h2>
      <p>Fortune 500 CISO, The Chair, Virtual CISO, Principal Engineer, Passed Over, Burned Out and Shown the Door. Not every good career ends in the CISO seat, and the game treats that as a real outcome, not a loss.</p>` },
    { go: all, html: `<span class="speaker">${S[3]}</span><div class="k">Why this reflects the real world</div><h2>What the ladder rewards</h2>
      <ol><li><b>Containment over certainty.</b> Acting fast with incomplete information is the job from day one.</li>
      <li><b>Business language.</b> Past the middle rungs, explaining risk to executives matters as much as technical skill.</li>
      <li><b>Integrity compounds.</b> Hiding a breach or blaming an employee costs more later than it saves now.</li>
      <li><b>Burnout is a career risk.</b> Taking every page and every project can knock you off the ladder.</li></ol>` },
    { go: () => {}, html: `<span class="speaker">${S[0]}</span><div class="k">Exam question</div><h2>Check your knowledge</h2>
      <p>Which certification requires five years of paid work experience before it is awarded?</p><ol type="A"><li>CompTIA Security+</li><li>CISSP</li><li>ISC2 Certified in Cybersecurity (CC)</li><li>CompTIA CySA+</li></ol>
      <p style="margin-top:8px;color:#b7bdc8">Answer: B. CISSP (ISC2).</p>` },
    { go: () => {}, html: `<span class="speaker">${S[0]}</span><div class="k">AI disclosure</div><h2>How we built it</h2>
      <p>We used AI tools and say so plainly: the story was drafted with Grok, the art generated with OpenAI image generation through Codex, the voices made with Kokoro (open-source text to speech), and the code, animation and this map built with Claude. Every fact on screen was checked against BLS, IANS / Artico and ISC2. Our team chose the topic, directed and reviewed every part, and wrote our own conclusions.</p>` },
  ];
}
function go(i) {
  at = Math.max(0, Math.min(STOPS.length - 1, i));
  STOPS[at].go(); panel(STOPS[at].html);
  $("#stopn").textContent = `${at + 1} / ${STOPS.length}`;
}
addEventListener("keydown", e => {
  if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(at + 1); }
  if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(at - 1); }
  if (e.key === "Home") go(0);
});
addEventListener("resize", () => apply());
</script>
